name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  branch-updated:
    name: Branche à jour avec la cible
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que la branche contient la branche cible
        run: |
          TARGET="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}"

          TARGET_SHA="$(git rev-parse "$TARGET")"
          MERGE_BASE="$(git merge-base HEAD "$TARGET_SHA")"

          if [ "$MERGE_BASE" != "$TARGET_SHA" ]; then
            echo "La branche n'est pas à jour avec ${{ github.base_ref }}."
            echo "Commits manquants :"
            git log --oneline "$MERGE_BASE..$TARGET_SHA" | head -20
            echo ""
            echo "Mettre à jour la branche :"
            echo "  git fetch origin && git rebase origin/${{ github.base_ref }}"
            echo "ou : git merge origin/${{ github.base_ref }}"
            exit 1
          fi

          echo "La branche est à jour avec ${{ github.base_ref }}."

  api-tests:
    name: Tests API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest -v

  web-build:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install

      - name: Construire le frontend
        run: npm run build
