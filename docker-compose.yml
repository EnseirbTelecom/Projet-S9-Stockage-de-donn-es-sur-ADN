
services:
  postgres:
    image: postgres:17
    container_name: adn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adn_db
      POSTGRES_USER: adn_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adn_user -d adn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: adn-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://adn_user:${POSTGRES_PASSWORD}@postgres:5432/adn_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    container_name: adn-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
